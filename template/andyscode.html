<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Andyscode Template</title>

<!-- GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Explora&family=Aboreto&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
}

body {
    font-family: Georgia, serif;
    color: #1f2a34;
}

.andyscode-content {
    position: relative;
    width: 700px;
    margin: 40px auto;
    top: 120px;
    padding-bottom: 60px;
    filter:
        drop-shadow(0 0 6px #8b0000)
        drop-shadow(0 0 15px #6b0000)
        drop-shadow(0 0 30px rgba(255,0,0,.35));
}

/* ENTIRE BACKGROUND */
.andyscode-content::before {
    content: "";
    position: absolute;
    z-index: 0;
    top: 0;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 550px;
    background: #120000;
    clip-path: polygon(
        50% 0,
        100% 10%,
        100% 100%,
        0 100%,
        0 10%
    );
    box-shadow:
        0 3px 8px rgba(0,0,0,.7),
        0 0 6px #8b0000;
}

/* BLOOD DRIPS AT VERY BOTTOM */
.drip {
    position: absolute;
    z-index: 30;
    top: calc(100% - 60px);
    background: linear-gradient(to bottom, #120000, #4d0000);
    border-radius: 0 0 50% 50%;
    box-shadow: none;
}

/* DRIP POSITIONS */
.drip.one {
    left: 12%;
    width: 16px;
    height: 38px;
}

.drip.two {
    left: 19%;
    width: 27px;
    height: 65px;
}

.drip.three {
    left: 26%;
    width: 14px;
    height: 32px;
}

.drip.four {
    left: 33%;
    width: 35px;
    height: 82px;
}

.drip.five {
    left: 40%;
    width: 18px;
    height: 48px;
}

.drip.six {
    left: 46%;
    width: 30px;
    height: 72px;
}

.drip.seven {
    left: 52%;
    width: 13px;
    height: 35px;
}

.drip.eight {
    left: 58%;
    width: 40px;
    height: 95px;
}

.drip.nine {
    left: 65%;
    width: 17px;
    height: 45px;
}

.drip.ten {
    left: 71%;
    width: 32px;
    height: 78px;
}

.drip.eleven {
    left: 77%;
    width: 14px;
    height: 38px;
}

.drip.twelve {
    left: 83%;
    width: 38px;
    height: 88px;
}

/* IMAGE */
.andyscode-image {
    position: relative;
    z-index: 10;
    width: 479px;
    height: 700px;
    margin: 0 auto;
    top: -200px;
    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/andyscode/refs/heads/main/Andy_hot_gal.webp");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* TEXT BOX */
.andyscode-text {
    position: relative;
    z-index: 5;
    width: 550px;
    min-height: 350px;
    margin: 0 auto;
    margin-top: -180px;
    padding: 30px;
    text-align: justify;
    background: transparent;
}

/* BODY TEXT */
.andyscode-body {
    position: relative;
    z-index: 5;
    width: 500px;
    margin: 0 auto;
    padding: 75px 0 0 0;
    text-align: justify;
    color: #fafabb;
    font-size: 13px;
    line-height: 1.6;
    overflow-x: hidden;
    overflow-y: auto;
}

/* TITLE */
.andyscode-title {
    position: absolute;
    z-index: 20;
    top: 550px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    margin: 0;
    padding: 0;
    text-align: center;
    font-size: 80px;
    letter-spacing: 4px;
    font-family: "Explora", cursive;
    line-height: 1;
    background: linear-gradient(
        to right,
        #6b0000,
        #ff3b3b,
        #a00000,
        #ff6666,
        #6b0000
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
}

/* QUOTE UNDER TITLE */
.andyscode-quote {
    position: absolute;
    z-index: 20;
    top: 635px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    margin: 0;
    padding: 0;
    text-align: center;
    font-size: 15px;
    font-family: "Aboreto", serif;
    font-style: normal;
    font-weight: 400;
    line-height: 1.2;
    background: linear-gradient(
        to right,
        #5a0000,
        #a00000,
        #d4af37,
        #ffd966,
        #d4af37,
        #a00000,
        #5a0000
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
}
</style>

</head>

<body>

<div class="andyscode-content">

    <div class="andyscode-image"></div>

    <div class="andyscode-title">
        Deadlock
    </div>

    <div class="andyscode-quote">
        We answer in a voice made of teeth
    </div>

    <div class="andyscode-text">
        <div class="andyscode-body">
            Your text goes here.
        </div>
    </div>

    <div class="drip one"></div>
    <div class="drip two"></div>
    <div class="drip three"></div>
    <div class="drip four"></div>
    <div class="drip five"></div>
    <div class="drip six"></div>
    <div class="drip seven"></div>
    <div class="drip eight"></div>
    <div class="drip nine"></div>
    <div class="drip ten"></div>
    <div class="drip eleven"></div>
    <div class="drip twelve"></div>

</div>

</body>
</html>
